<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<title>プログラム</title>
<link rel="stylesheet" href="./src/styles/base.css">
<link rel="stylesheet" href="./src/styles/detail.css">
<script type="module" src="./src/js/detail.js"></script>
</head>
<body>
<header class="header">
  <button class="menu" type="button" aria-label="メニュー"><span></span><span></span><span></span></button>
  <a class="logo-link" href="./" aria-label="プログラム一覧へ">
    <!-- 仮ロゴ。本物の画像は src/config.js の logo.src で指定すると自動で差し替わります -->
    <svg class="logo" viewBox="0 0 40 40" fill="none" stroke="var(--logo)" stroke-width="1.6" role="img" aria-label="ロゴ">
      <ellipse cx="20" cy="20" rx="16.5" ry="15.5" transform="rotate(-12 20 20)"/>
      <ellipse cx="20" cy="20" rx="15" ry="16.5" transform="rotate(25 20 20)"/>
      <ellipse cx="20" cy="20" rx="12" ry="11.5" transform="rotate(8 20 20)" stroke-width="2.4"/>
    </svg>
  </a>
</header>
<main>
  <p class="back"><a class="text-link" href="./">← プログラム一覧</a></p>
  <!-- 中身は URL の ?id= と public/data/programs.json から生成 -->
  <article class="detail" id="detail" aria-busy="true">
    <div class="thumb detail-hero" aria-hidden="true"></div>
  </article>
  <nav class="pager" id="pager" aria-label="前後のプログラム" hidden></nav>
</main>
</body>
</html>
